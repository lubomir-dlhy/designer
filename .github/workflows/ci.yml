name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same branch — saves runner minutes when a
# series of pushes lands quickly.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.0'
      - run: bun ci
      - run: bun audit --prod --audit-level=high
      - run: bun run check
      - run: bun test
      - name: Verify Bun entrypoint
        run: ./bin/designer.mjs --version

  smoke:
    name: clean-room install smoke
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.0'
      - run: bun ci
      # install-smoke.sh packs with Bun, then installs the tarball into a stock Bun
      # container. ubuntu-latest already has docker available.
      - run: bash scripts/install-smoke.sh
