name: lockfile-refresh

on:
  schedule:
    # Sunday 14:00 UTC — fresh lockfile waiting for Monday review.
    - cron: '0 14 * * 0'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.0'

      - name: Refresh transitive deps
        # `bun update` resolves the latest versions within package.json's
        # existing ranges and rewrites bun.lock. Major bumps remain Dependabot's job.
        run: bun update

      - name: Confirm tree still builds
        run: |
          bun ci
          bun audit --prod --audit-level=high
          bun run check
          bun test

      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          branch: chore/lockfile-refresh
          title: 'chore(deps): weekly lockfile refresh'
          commit-message: 'chore(deps): weekly lockfile refresh'
          body: |
            Weekly `bun update` to pull transitive bug-fix releases within
            existing semver ranges. Auto-generated by `lockfile-refresh.yml`.

            Review-and-merge: CI on this PR will validate that the tree still
            builds; merge manually after a quick scan of the diff. (Unlike
            dependabot PRs, lockfile-refresh PRs are authored by
            `github-actions[bot]` and the auto-merge workflow does not gate
            on them.)
          labels: |
            dependencies
            lockfile
          add-paths: |
            bun.lock
