version: 2

# Weekly cadence keeps dependency changes reviewable. Every update remains a
# separate, manually-reviewed PR; dependency changes are never auto-merged.
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: America/Los_Angeles
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      # release-please ignores `chore(deps):` for version bumps but they show
      # up in the `Other Changes` block of the changelog — exactly right.
      prefix: 'chore(deps)'
      include: scope

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: monthly
    labels:
      - dependencies
      - github-actions
